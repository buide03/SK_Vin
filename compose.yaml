services:
  app:
    build: .
    ports:
      - "127.0.0.1:3001:10000"
    env_file: .env.docker
    environment:
      DATA_DIR: /var/data
      DEMO_REQUIRE_ACCESS: "true"
    volumes:
      - agent_data:/var/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
volumes:
  agent_data:
